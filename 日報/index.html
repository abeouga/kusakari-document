<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kusakari 日報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&display=swap">
<style>
/* 配置: 左に日付の帯、右に1日分。1日は「まとめ → 仕様 → 変更 → 会話」の順に縦に読む。
   見た目はデジタル庁デザインシステム(DADS)に寄せている。色の値は digital-go-jp/design-tokens の tokens.css から取った。
   DADS にはダークモードの色の決まりが無いので、暗い表示は DADS の同じ色の濃淡から選んだ。
   app.css は下の「役割の名前」(--bg、--text など)だけを使う。明暗で変えるのはこの名前の値だけ。
   前のひな形(緑がかった配色)は backup-html/ にある。 */
:root {
  color-scheme: light;
  /* DADS の色(明暗どちらでも同じ値) */
  --blue-50: #e8f1fe; --blue-200: #c5d7fb; --blue-300: #9db7f9; --blue-400: #7096f8; --blue-700: #264af4; --blue-800: #0031d8;
  --blue-900: #0017c1; --blue-1000: #00118f; --blue-1100: #000071; --blue-1200: #000060;
  --lb-50: #f0f9ff; --lb-200: #c0e4ff; --lb-400: #57b8ff; --lb-800: #0066be; --lb-900: #0055ad; --lb-1200: #00234b;
  --green-50: #e6f5ec; --green-200: #9bd4b5; --green-400: #51b883; --green-800: #197a4b; --green-900: #115a36; --green-1200: #032213;
  --orange-50: #ffeee2; --orange-200: #ffc199; --orange-300: #ffa66d; --orange-400: #ff8d44; --orange-800: #c74700; --orange-900: #ac3e00; --orange-1200: #541e00;
  --yellow-50: #fbf5e0; --yellow-200: #ffe380; --yellow-300: #ffd43d; --yellow-400: #ffc700; --yellow-900: #927200; --yellow-1000: #806300; --yellow-1200: #604b00;
  --red-300: #ff9696; --red-800: #ec0000;
  --magenta-300: #ff8eff; --magenta-900: #8b008b;
  --white: #ffffff; --black: #000000;
  --gray-50: #f2f2f2; --gray-100: #e6e6e6; --gray-200: #cccccc; --gray-300: #b3b3b3; --gray-420: #949494;
  --gray-536: #767676; --gray-600: #666666; --gray-700: #4d4d4d; --gray-800: #333333; --gray-900: #1a1a1a;
  --font-sans: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
  --font-mono: 'Noto Sans Mono', 'Noto Sans JP', Consolas, monospace;

  /* 役割の名前(明るい表示) */
  --bg: var(--white);            /* ページの地 */
  --surface: var(--gray-50);     /* コメント欄の地 */
  --surface-accent: var(--blue-50);  /* 3行まとめ・選んでいる日付の地 */
  --line-accent: var(--blue-200);
  --text: var(--gray-800);
  --text-strong: var(--gray-900);    /* 見出し */
  --text-sub: var(--gray-700);
  --text-muted: var(--gray-600);     /* 補足・日時 */
  --line: var(--gray-200);
  --line-strong: var(--gray-420);
  --line-input: var(--gray-600);
  --line-input-hover: var(--black);
  --accent: var(--blue-900);
  --accent-strong: var(--blue-1000);
  --on-accent: var(--white);         /* 青の上の文字 */
  --accent-hover-bg: var(--blue-200);
  --link: var(--blue-1000);
  --link-hover: var(--blue-900);
  --link-visited: var(--magenta-900);
  --focus-line: var(--black);
  --focus-ring: var(--yellow-300);
  --focus-link-text: var(--blue-1000);
  --danger: var(--red-800);
  --caution-text: var(--orange-900);
  --disabled-bg: var(--gray-200);
  --disabled-text: var(--gray-50);
  --notice-line: var(--yellow-900);
  --notice-bar: var(--yellow-400);
  --dot: var(--gray-536);
  /* ラベル: 枠線・地・文字 */
  --c-ok-line: var(--green-800); --c-ok-bg: var(--green-50); --c-ok-text: var(--green-900);
  --c-prop-line: var(--blue-700); --c-prop-bg: var(--blue-50); --c-prop-text: var(--blue-800);
  --c-wip-line: var(--lb-800); --c-wip-bg: var(--lb-50); --c-wip-text: var(--lb-900);
  --c-drop-line: var(--gray-700); --c-drop-bg: var(--gray-50); --c-drop-text: var(--gray-800);
  --c-manual-line: var(--blue-900); --c-manual-bg: var(--white); --c-manual-text: var(--blue-900);
  --c-check-line: var(--orange-800); --c-check-bg: var(--orange-50); --c-check-text: var(--orange-900);
  --c-prov-line: var(--yellow-900); --c-prov-bg: var(--yellow-50); --c-prov-text: var(--yellow-1000);
  --c-read-line: var(--gray-420); --c-read-bg: var(--white); --c-read-text: var(--gray-700);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: var(--gray-900); --surface: var(--gray-800); --surface-accent: color-mix(in srgb, var(--blue-400) 18%, var(--gray-900)); --line-accent: color-mix(in srgb, var(--blue-400) 45%, var(--gray-900));
    --text: var(--gray-100); --text-strong: var(--white); --text-sub: var(--gray-200); --text-muted: var(--gray-300);
    --line: var(--gray-700); --line-strong: var(--gray-536); --line-input: var(--gray-420); --line-input-hover: var(--white);
    --accent: var(--blue-300); --accent-strong: var(--blue-200); --on-accent: var(--blue-1200); --accent-hover-bg: var(--blue-1100);
    --link: var(--blue-300); --link-hover: var(--blue-200); --link-visited: var(--magenta-300);
    --focus-line: var(--yellow-300); --focus-ring: var(--black); --focus-link-text: var(--blue-1000);
    --danger: var(--red-300); --caution-text: var(--orange-300);
    --disabled-bg: var(--gray-700); --disabled-text: var(--gray-420);
    --notice-line: var(--yellow-400); --notice-bar: var(--yellow-400);
    --dot: var(--gray-420);
    --c-ok-line: var(--green-400); --c-ok-bg: var(--green-1200); --c-ok-text: var(--green-200);
    --c-prop-line: var(--blue-400); --c-prop-bg: color-mix(in srgb, var(--blue-400) 18%, var(--gray-900)); --c-prop-text: var(--blue-200);
    --c-wip-line: var(--lb-400); --c-wip-bg: var(--lb-1200); --c-wip-text: var(--lb-200);
    --c-drop-line: var(--gray-420); --c-drop-bg: var(--gray-800); --c-drop-text: var(--gray-100);
    --c-manual-line: var(--blue-300); --c-manual-bg: transparent; --c-manual-text: var(--blue-300);
    --c-check-line: var(--orange-400); --c-check-bg: var(--orange-1200); --c-check-text: var(--orange-200);
    --c-prov-line: var(--yellow-400); --c-prov-bg: var(--yellow-1200); --c-prov-text: var(--yellow-200);
    --c-read-line: var(--gray-536); --c-read-bg: transparent; --c-read-text: var(--gray-200);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--gray-900); --surface: var(--gray-800); --surface-accent: color-mix(in srgb, var(--blue-400) 18%, var(--gray-900)); --line-accent: color-mix(in srgb, var(--blue-400) 45%, var(--gray-900));
  --text: var(--gray-100); --text-strong: var(--white); --text-sub: var(--gray-200); --text-muted: var(--gray-300);
  --line: var(--gray-700); --line-strong: var(--gray-536); --line-input: var(--gray-420); --line-input-hover: var(--white);
  --accent: var(--blue-300); --accent-strong: var(--blue-200); --on-accent: var(--blue-1200); --accent-hover-bg: var(--blue-1100);
  --link: var(--blue-300); --link-hover: var(--blue-200); --link-visited: var(--magenta-300);
  --focus-line: var(--yellow-300); --focus-ring: var(--black); --focus-link-text: var(--blue-1000);
  --danger: var(--red-300); --caution-text: var(--orange-300);
  --disabled-bg: var(--gray-700); --disabled-text: var(--gray-420);
  --notice-line: var(--yellow-400); --notice-bar: var(--yellow-400);
  --dot: var(--gray-420);
  --c-ok-line: var(--green-400); --c-ok-bg: var(--green-1200); --c-ok-text: var(--green-200);
  --c-prop-line: var(--blue-400); --c-prop-bg: color-mix(in srgb, var(--blue-400) 18%, var(--gray-900)); --c-prop-text: var(--blue-200);
  --c-wip-line: var(--lb-400); --c-wip-bg: var(--lb-1200); --c-wip-text: var(--lb-200);
  --c-drop-line: var(--gray-420); --c-drop-bg: var(--gray-800); --c-drop-text: var(--gray-100);
  --c-manual-line: var(--blue-300); --c-manual-bg: transparent; --c-manual-text: var(--blue-300);
  --c-check-line: var(--orange-400); --c-check-bg: var(--orange-1200); --c-check-text: var(--orange-200);
  --c-prov-line: var(--yellow-400); --c-prov-bg: var(--yellow-1200); --c-prov-text: var(--yellow-200);
  --c-read-line: var(--gray-536); --c-read-bg: transparent; --c-read-text: var(--gray-200);
}
body { background: var(--bg); color: var(--text); }
</style>
<link rel="stylesheet" href="app.css">
<div class="shell">
  <aside class="days" id="days" aria-label="日付の一覧">
    <div class="days-head">
      <p class="brand">Kusakari 日報</p>
      <button type="button" class="days-toggle" id="days-toggle" aria-expanded="false" aria-controls="day-list">日付を選ぶ</button>
    </div>
    <ol class="day-list" id="day-list"></ol>
  </aside>
  <main class="day" id="day">
    <p class="empty">日報を読み込んでいます。</p>
  </main>
</div>
<script src="data/index.js"></script>
<script src="app.js"></script>

</body>
</html>
